import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def getGitHash = { ->
    try {
        return providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return ""
    }
}

def getGitTag = { ->
    try {
        return providers.exec {
            commandLine 'git', 'describe', '--tags', '--exact-match'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return ""
    }
}

android {
    namespace 'com.fll.pushtogithub'
    compileSdk 34

    defaultConfig {
        applicationId "com.fll.pushtogithub"
        minSdk 24        // Android 7.0 — matches LEGO SPIKE app's minimum
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "GIT_HASH", "\"${getGitHash()}\""
        buildConfigField "String", "GIT_TAG", "\"${getGitTag()}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':shared')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Encrypted storage for the GitHub token and repo config.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Coroutines for background network work off the UI thread.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // HTTP client for the GitHub REST API.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON handling for GitHub API request/response bodies.
    implementation 'org.json:json:20240303'

    // AndroidSVG for rendering SVG vector diagrams from SPIKE projects
    implementation 'com.caverock:androidsvg-aar:1.4'

    // Google ML Kit Text Recognition for transcribing handwritten notes & photos
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
